name: foundation-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Contract, unit, intent, and evaluator checks
        run: scripts/verify-local.sh
      - name: Secret and placeholder scan
        run: |
          ! rg -n -i 'BEGIN (RSA|OPENSSH|PRIVATE)|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|card=[0-9]{6,}|Bearer [A-Za-z0-9._~-]+' foundation services evaluators infra scripts tests config docker README.md
      - name: Build the local runtime image
        run: docker build --file docker/dev/Dockerfile --tag ai-saas-foundation:ci .
      - name: Validate stage compose override merges cleanly
        # docker:stage is prod compose + stage override. Surface merge-time
        # errors at PR time, not at operator runtime. The stage override
        # uses ${VAR:?required} substitution for secrets, so we feed a
        # dummy env file (mktemp, never committed) to satisfy compose.
        run: |
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          printf 'DATABASE_URL=postgresql://ci/ci\nDATABASE_URL_UNPOOLED=postgresql://ci/ci\nAPP_SECRET_KEY=%s\nBETTER_AUTH_SECRET=%s\n' \
            "$(printf 'x%.0s' {1..32})" \
            "$(printf 'x%.0s' {1..32})" > "$tmp"
          docker compose --env-file "$tmp" \
            -f docker/prod/compose.yaml -f docker/stage/compose.yaml config -q
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and build web console
        run: pnpm --filter ai-saas-foundation-web test:all
