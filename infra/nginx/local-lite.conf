events {}

http {
    server {
        listen 8080;
        location /v1/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
        }
        location /healthz {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
