# Temporary Toss sandbox stack. Layer this file after compose.yaml to keep the
# sandbox isolated from the default 3000/8080/5432 stack.
#
#   export APP_SECRET_KEY="$(openssl rand -hex 32)"
#   export TOSS_CLIENT_KEY="test_ck_..."
#   export TOSS_SECRET_KEY="test_sk_..."
#   docker compose -p ai-saas-toss-sandbox \
#     -f docker/prod/compose.yaml \
#     -f docker/prod/compose.toss-sandbox.yaml up --build

name: ai-saas-foundation-toss-sandbox

services:
  postgres:
    command: ["postgres", "-p", "5433", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    ports: !override
      - "${TOSS_POSTGRES_PORT:-55433}:5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation -d foundation -p 5433"]

  foundation:
    command: ["uv", "run", "--frozen", "--no-dev", "python", "-m", "foundation.server", "--env-file", "/app/config/profiles/free-portfolio.example.env", "--profile", "free-portfolio", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      APP_BASE_URL: ${TOSS_FOUNDATION_PUBLIC_URL:-http://localhost:18081}
      DATABASE_URL: postgresql://foundation@postgres:5433/foundation
      PAYMENT_PROVIDER: toss
      MOCK_PAYMENTS_ENABLED: "false"
      PAYMENT_SANDBOX: "true"
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:?set TOSS_CLIENT_KEY to a Toss sandbox client key}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:?set TOSS_SECRET_KEY to a Toss sandbox secret key}
      TOSS_WEBHOOK_SECRET: ${TOSS_WEBHOOK_SECRET:-}
      TOSS_SUCCESS_URL: ${TOSS_SUCCESS_URL:-http://localhost:3001/payments/toss/success}
      TOSS_BILLING_SUCCESS_URL: ${TOSS_BILLING_SUCCESS_URL:-http://localhost:3001/payments/toss/billing-success}
      TOSS_FAIL_URL: ${TOSS_FAIL_URL:-http://localhost:3001/payments/toss/fail}
    ports: !override
      - "${TOSS_FOUNDATION_PORT:-18081}:8081"
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "--no-dev", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3)"]

  web-migrate:
    environment:
      DATABASE_URL: postgresql://foundation@postgres:5433/foundation

  web:
    environment:
      PORT: "3001"
      APP_BASE_URL: ${TOSS_WEB_PUBLIC_URL:-http://localhost:3001}
      BETTER_AUTH_URL: ${TOSS_WEB_PUBLIC_URL:-http://localhost:3001}
      DATABASE_URL: postgresql://foundation@postgres:5433/foundation
      FOUNDATION_API_URL: http://foundation:8081
      PAYMENT_PROVIDER: toss
      MOCK_PAYMENTS_ENABLED: "false"
      PAYMENT_SANDBOX: "true"
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:?set TOSS_CLIENT_KEY to a Toss sandbox client key}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:?set TOSS_SECRET_KEY to a Toss sandbox secret key}
      TOSS_API_BASE_URL: ${TOSS_API_BASE_URL:-https://api.tosspayments.com}
      TOSS_WEBHOOK_SECRET: ${TOSS_WEBHOOK_SECRET:-}
      TOSS_SUCCESS_URL: ${TOSS_SUCCESS_URL:-http://localhost:3001/payments/toss/success}
      TOSS_BILLING_SUCCESS_URL: ${TOSS_BILLING_SUCCESS_URL:-http://localhost:3001/payments/toss/billing-success}
      TOSS_FAIL_URL: ${TOSS_FAIL_URL:-http://localhost:3001/payments/toss/fail}
    ports: !override
      - "${TOSS_WEB_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(() => process.exit(0)).catch(() => process.exit(1))"]
