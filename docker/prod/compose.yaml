name: ai-saas-foundation

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: foundation
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: foundation
    volumes:
      - foundation_postgres_data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    ports:
      - "${POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation -d foundation"]
      interval: 5s
      timeout: 5s
      retries: 10

  foundation:
    build:
      context: ../..
      dockerfile: docker/prod/foundation.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEPLOYMENT_PROFILE: free-portfolio
      APP_BASE_URL: ${FOUNDATION_PUBLIC_URL:-http://localhost:8180}
      DATABASE_URL: postgresql://foundation@postgres:5432/foundation
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY to a generated value}
      CONTRACT_VERSION: v1
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      MOCK_PAYMENTS_ENABLED: ${MOCK_PAYMENTS_ENABLED:-true}
      PAYMENT_SANDBOX: ${PAYMENT_SANDBOX:-true}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      TOSS_WEBHOOK_SECRET: ${TOSS_WEBHOOK_SECRET:-}
      TOSS_SUCCESS_URL: ${TOSS_SUCCESS_URL:-http://localhost:3000/payments/toss/success}
      TOSS_BILLING_SUCCESS_URL: ${TOSS_BILLING_SUCCESS_URL:-http://localhost:3000/payments/toss/billing-success}
      TOSS_FAIL_URL: ${TOSS_FAIL_URL:-http://localhost:3000/payments/toss/fail}
      WORKFLOW_PROVIDER: local
      PAID_INFRASTRUCTURE: "false"
      AWS_WORKER_ENABLED: "false"
      RUN_QUOTA_MAX_RUNS: ${RUN_QUOTA_MAX_RUNS:-10}
      RUN_QUOTA_MAX_UNITS: ${RUN_QUOTA_MAX_UNITS:-100}
      RUN_QUOTA_PERIOD_SECONDS: ${RUN_QUOTA_PERIOD_SECONDS:-86400}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-0.1}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-memory}
      LOCAL_STATE_DB: /var/lib/ai-saas/foundation.sqlite3
      UV_CACHE_DIR: /tmp/uv-cache
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - foundation_state:/var/lib/ai-saas
    ports:
      - "${FOUNDATION_PORT:-8180}:8080"

  web-migrate:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: migrator
    environment:
      # Drizzle migrations use Neon direct/unpooled connections. The local
      # profile supplies the same local URL for both runtime and migration.
      DATABASE_URL: ${WEB_DATABASE_URL_UNPOOLED:-postgresql://foundation@postgres:5432/foundation}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "ai-saas-foundation-web", "db:migrate"]
    restart: "no"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: runner
    environment:
      APP_ENV: ${WEB_APP_ENV:-local}
      APP_BASE_URL: ${WEB_PUBLIC_URL:-http://localhost:3100}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3100}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      DATABASE_URL: ${WEB_DATABASE_URL:-postgresql://foundation@postgres:5432/foundation}
      FOUNDATION_API_URL: http://foundation:8080
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PAYMENT_PROVIDER: ${WEB_PAYMENT_PROVIDER:-mock}
      PAYMENT_SANDBOX: ${PAYMENT_SANDBOX:-true}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      TOSS_API_BASE_URL: ${TOSS_API_BASE_URL:-https://api.tosspayments.com}
      TOSS_WEBHOOK_SECRET: ${TOSS_WEBHOOK_SECRET:-}
      TOSS_SUCCESS_URL: ${TOSS_SUCCESS_URL:-http://localhost:3000/payments/toss/success}
      TOSS_BILLING_SUCCESS_URL: ${TOSS_BILLING_SUCCESS_URL:-http://localhost:3000/payments/toss/billing-success}
      TOSS_FAIL_URL: ${TOSS_FAIL_URL:-http://localhost:3000/payments/toss/fail}
      LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID:-}
      LEMONSQUEEZY_VARIANT_ID: ${LEMONSQUEEZY_VARIANT_ID:-}
      LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY:-}
    depends_on:
      foundation:
        condition: service_healthy
      web-migrate:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  foundation_postgres_data:
  foundation_state:
