# The production compose file is also the local Docker deployment used for
# development and acceptance testing. It intentionally keeps the database
# passwordless, matching POSTGRES_HOST_AUTH_METHOD=trust, including when the
# named volume was initialized by an older compose configuration.
local   all             all                                     trust
host    all             all             0.0.0.0/0               trust
host    all             all             ::/0                    trust
