# Stage override for docker/prod/compose.yaml.
#
# Purpose: production-shape images (Next.js `runner`, foundation prod target)
# pointed at a Neon cloud DB, exposed on a separate slot-derived port range
# (3200 / 8280 / 56433) so it never collides with `docker:local`.
#
# Required env (script enforces these — stage refuses to run otherwise):
#   DATABASE_URL              Neon pooled URL
#   DATABASE_URL_UNPOOLED     Neon direct/unpooled URL (used by Drizzle migrations)
#   BETTER_AUTH_SECRET        >= 32-byte hex
#   APP_SECRET_KEY            >= 32-byte hex
#
# Slot math (script docker-stage.sh):
#   WEB_PORT          = 3200 + 10 * slot
#   FOUNDATION_PORT   = 8280 + 10 * slot
#   POSTGRES_PORT     = 56433 + 10 * slot    (only when LOCAL_POSTGRES=true)

name: ai-saas-foundation-stage

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["local-postgres"]
    environment:
      POSTGRES_USER: foundation
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: foundation
    volumes:
      - foundation_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation -d foundation"]
      interval: 5s
      timeout: 5s
      retries: 10

  foundation:
    build:
      context: ../..
      dockerfile: docker/prod/foundation.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DEPLOYMENT_PROFILE: free-portfolio
      APP_BASE_URL: ${FOUNDATION_PUBLIC_URL:-http://localhost:${FOUNDATION_PORT}}
      DATABASE_URL: ${DATABASE_URL:?stage requires DATABASE_URL (Neon pooled)}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?stage requires APP_SECRET_KEY}
      CONTRACT_VERSION: v1
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      MOCK_PAYMENTS_ENABLED: ${MOCK_PAYMENTS_ENABLED:-true}
      PAYMENT_SANDBOX: ${PAYMENT_SANDBOX:-true}
      WORKFLOW_PROVIDER: local
      PAID_INFRASTRUCTURE: "false"
      AWS_WORKER_ENABLED: "false"
      RUN_QUOTA_MAX_RUNS: ${RUN_QUOTA_MAX_RUNS:-10}
      RUN_QUOTA_MAX_UNITS: ${RUN_QUOTA_MAX_UNITS:-100}
      RUN_QUOTA_PERIOD_SECONDS: ${RUN_QUOTA_PERIOD_SECONDS:-86400}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-0.1}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-memory}
      LOCAL_STATE_DB: /var/lib/ai-saas/foundation.sqlite3
      UV_CACHE_DIR: /tmp/uv-cache
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - foundation_state:/var/lib/ai-saas
    ports:
      - "${FOUNDATION_PORT}:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  web-migrate:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: migrator
    environment:
      # Never use the pooled URL for Drizzle migrations.
      DATABASE_URL: ${DATABASE_URL_UNPOOLED:?stage requires DATABASE_URL_UNPOOLED (Neon direct)}
    command: ["pnpm", "--filter", "ai-saas-foundation-web", "db:migrate"]
    restart: "no"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-true}
    environment:
      APP_ENV: ${WEB_APP_ENV:-staging}
      APP_BASE_URL: ${WEB_PUBLIC_URL:-http://localhost:${WEB_PORT}}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${WEB_PORT}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?stage requires BETTER_AUTH_SECRET}
      # Runtime traffic uses the pooled Neon URL.
      DATABASE_URL: ${DATABASE_URL:?stage requires DATABASE_URL (Neon pooled)}
      FOUNDATION_API_URL: http://foundation:8080
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FAQ_OPENAI_ENABLED: ${FAQ_OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1/responses}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-5000}
      PAYMENT_PROVIDER: ${WEB_PAYMENT_PROVIDER:-mock}
      PAYMENT_SANDBOX: ${PAYMENT_SANDBOX:-true}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      TOSS_SDK_SANDBOX_RESULT: ${TOSS_SDK_SANDBOX_RESULT:-SUCCESS}
      TOSS_API_BASE_URL: ${TOSS_API_BASE_URL:-https://api.tosspayments.com}
      TOSS_WEBHOOK_SECRET: ${TOSS_WEBHOOK_SECRET:-}
      TOSS_SUCCESS_URL: ${TOSS_SUCCESS_URL:-http://localhost:${WEB_PORT}/payments/toss/success}
      TOSS_BILLING_SUCCESS_URL: ${TOSS_BILLING_SUCCESS_URL:-http://localhost:${WEB_PORT}/payments/toss/billing-success}
      TOSS_FAIL_URL: ${TOSS_FAIL_URL:-http://localhost:${WEB_PORT}/payments/toss/fail}
    depends_on:
      foundation:
        condition: service_healthy
      web-migrate:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  foundation_postgres_data:
  foundation_state: