services:
  web:
    build:
      target: development
    command: ["pnpm", "--filter", "ai-saas-foundation-web", "exec", "next", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      NODE_ENV: development
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 30s
      start_period: 90s
      retries: 3
