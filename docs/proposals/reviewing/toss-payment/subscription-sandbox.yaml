title: Toss Payments subscription sandbox integration
status: design-discussion
date: 2026-09-20
tags: [toss-payments, subscription, sandbox, tdd]

before:
  summary: |
    The web catalog has subscription options and an admin provider registry,
    but Toss checkout is still treated as a generic payment handoff. The
    browser does not distinguish requestPayment from requestBillingAuth, the
    success route only confirms paymentKey, and the environment provider can
    override the persisted admin selection.
  evidence:
    - 'apps/web/components/pricing-catalog.tsx:16-29 uses one generic checkout path.'
    - 'apps/web/app/payments/toss/success/route.ts:5-28 only confirms a normal paymentKey.'
    - 'apps/web/lib/pricing/repository.ts:278-283 returns PAYMENT_PROVIDER before persisted settings.'
    - 'Official MCP document 4: https://docs.tosspayments.com/guides/v2/billing/integration'

after:
  summary: |
    Subscription checkout uses Toss V2 billing authentication, then a server
    boundary issues the billing key and approves the first sandbox recurring
    charge against a persisted order. Admin Toss enable selects the sandbox
    provider safely, and local documentation explains keys, MCP, APP_SECRET_KEY,
    and localhost:3000 verification without exposing secrets.
  files:
    - path: apps/web/components/pricing-catalog.tsx
      change: Select requestBillingAuth for subscription options and requestPayment for one-time options; keep secret values server-side.
    - path: apps/web/lib/payments/catalog-checkout.ts
      change: Return provider-neutral billing-auth context with server-created order and customer identity.
    - path: apps/web/app/payments/toss
      change: Add billing-auth success handling and retain safe failure redirects.
    - path: apps/web/lib/pricing/repository.ts
      change: Make the persisted admin provider setting effective in local/test sandbox mode and validate Toss configuration.
    - path: apps/web/lib/payments/toss-billing.ts
      change: Add server-only billing-key issuance, recurring approval, one-time confirmation, matching-key validation, and idempotency headers.
    - path: apps/web/lib/payments/toss-settlement.ts
      change: Reconcile server-owned payment orders, issue the first billing key, approve the first subscription charge, and persist succeeded orders/subscriptions exactly once.
    - path: apps/web/app/payments/toss/billing-success/route.ts
      change: Accept only customerKey/authKey from the Toss billing redirect and complete the server settlement without exposing billingKey.
    - path: apps/web/app/payments/toss/success/route.ts
      change: Confirm catalog one-time payments through the web order boundary while preserving the legacy Foundation console fallback.
    - path: apps/web/db/schema/pricing.ts
      change: Preserve the subscription/order metadata needed for local provider selection and audit.
    - path: docker/prod/compose.yaml
      change: Pass sandbox keys and provider mode to the services that execute the flow.
    - path: apps/web/content/guides/02-payment-toss.md
      change: Document test-key issuance, official MCP connection, generated app secret, and localhost sandbox verification.
    - path: apps/web/tests/payment-adapter.test.ts
      change: Add subscription handoff, redaction, and sandbox guard contracts.
    - path: apps/web/tests/api-contract.test.ts
      change: Add admin-enable and checkout selection contracts.
    - path: apps/web/tests/toss-billing.test.ts
      change: Cover Basic auth, billing approval idempotency, normal confirmation, amount mismatch, and secret redaction.
    - path: apps/web/tests/toss-settlement.test.ts
      change: Cover first subscription charge, one-time settlement, and replay safety without calling Toss.

pros:
  - 'Uses the official Toss V2 billing-auth and automatic billing sequence documented by the MCP source.'
  - 'Keeps provider secrets and billing keys server-side while reusing the existing durable order and idempotent ledger.'
  - 'Makes the admin enable action observable and testable in the same localhost sandbox path.'

cons:
  - 'The first sandbox charge is covered, but production recurring scheduling remains out of scope; the setup guide must state this boundary.'
  - 'Toss automatic billing may require merchant risk review/contract before live use; sandbox success does not imply production approval.'

limitations:
  - 'The phase does not provide live payment capture, production webhooks, dunning, or a hosted scheduler.'
  - 'A real developer-center test-key pair is still required for manual browser verification.'

sections:
  - title: Goal
    body: |
      Connect the existing subscription catalog and admin Toss enable switch to a verified Toss Payments V2 sandbox flow that can be exercised at localhost:3000 without charging a real payment method.
  - title: Evidence and provider contract
    body: |
      Toss V2 automatic billing uses requestBillingAuth(), authKey/customerKey, billing-key issuance, and automatic billing approval. The existing code currently uses the normal one-time flow for every option and lets an environment default shadow the admin setting.
  - title: Design
    body: |
      Persist the pending order before the browser redirect, keep secrets and billing keys server-side, verify server-owned order/amount/customer values, and settle the first sandbox charge through the existing idempotent entitlement and credit ledger.
  - title: Safety boundary
    body: |
      Sandbox keys are required for local/test Toss enablement. Live keys, live capture, production scheduling, and webhook operations are explicitly excluded.
  - title: Acceptance
    body: |
      The implementation must pass the web type/tests and focused Python billing contracts, and the guide must make the Codex MCP and localhost:3000 setup reproducible.
