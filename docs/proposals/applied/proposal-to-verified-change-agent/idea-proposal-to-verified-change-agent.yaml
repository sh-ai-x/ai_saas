pros:
  - 'Creates one defensible product narrative: proposal to evidence-backed verified change, rather than a generic chatbot.'
  - 'Uses LangChain, LangGraph, and LangSmith in separate necessary layers with explicit ownership and no duplicated orchestration.'
  - 'Makes accuracy, hallucination, latency, safety, security, and ethics measurable through release gates and versioned evidence.'
  - 'Demonstrates human approval, sandbox isolation, checkpoint resume, and reviewable output without autonomous deploy or merge.'
  - 'Starts with a minimal MSA-shaped deployment and preserves physical extraction options only when workload or isolation evidence requires them.'
  - 'Supports every Git repository for analysis, then upgrades capability through a profile and adapter contract instead of blocking on a fixed language list.'
  - 'Turns evaluation maintenance into an evaluation-as-code feedback loop that automatically produces regression candidates from sanitized failures.'
  - 'Extends from verified change package to signed PR and policy-gated CI delivery without exposing ambient deployment credentials.'
  - 'Runs the complete portfolio demo on an 8GB MacBook Air without a local model or always-on infrastructure stack.'
  - 'Treats token usage as a measurable reliability budget, using bounded context and cache reuse without accepting a quality or safety regression.'

cons:
  - 'Provider-specific Git/CI adapters still need configuration; the mitigation is a provider-neutral delivery contract, local simulators, and conformance tests.'
  - 'High-impact delivery remains approval-gated; the mitigation is policy-based low-risk auto-approval and a single explicit approval only at the risk boundary.'
  - 'Local Lite does not reproduce every production failure domain; the mitigation is a contract-identical Production MSA profile exercised in CI.'

limitations:
  - 'The agent never receives ambient merge or deploy credentials; all delivery is delegated to scoped, auditable Git/CI adapters.'
  - 'A new runtime requires an adapter conformance pack before it can claim verified execution; analysis and plan generation remain available immediately.'
  - 'An 8GB laptop is a development/demo target, not the production isolation boundary; untrusted high-impact execution is disabled locally and delegated to the Production Sandbox Worker.'

scope:
  in_scope:
    - 'One proposal/PRD to one authorized Git repository per run, with analysis available for every repository profile.'
    - 'Typed requirements, acceptance criteria, targeted retrieval, capability profile confirmation, evidence references, approval, sandbox patching, tests, evaluation, and report.'
    - 'Auto-generated change-assurance.yaml capability manifest with allowlisted paths, test command, resource limits, and retention profile.'
    - 'Built-in Node/pnpm and Python/pytest execution adapters plus an adapter SDK and conformance test pack.'
    - 'Signed Git branch/PR creation and policy-gated CI delivery through scoped provider adapters.'
    - 'Evaluation-as-code: versioned datasets, automatic sanitized failure candidates, deterministic checks, and LangSmith regression runs.'
    - 'Metric registry and append-only event ledger with formulas, confidence intervals, sample minimums, and release status.'
    - 'Local Lite runtime: at most two long-lived processes, SQLite checkpoints, filesystem sandbox, remote model provider, redacted LangSmith traces, and no Docker Desktop requirement.'
    - 'Production MSA runtime: Nginx, separately deployable API/orchestrator/sandbox/delivery boundaries, and PostgreSQL ownership boundaries.'
    - 'Agent Platform Kernel and replaceable Project Pack boundary with versioned ports, registry, and conformance tests.'
    - 'Kernel-owned token budgets, context cache, bounded retrieval expansion, usage reconciliation, and fail-closed quota behavior.'
    - 'One configured model provider per deployment, no provider fallback in v1, and retrieval from repository inventory/symbols without a vector database.'
    - 'LangChain model/tool boundary, LangGraph durable workflow, LangSmith trace/evaluation boundary.'
    - 'Nginx edge proxy and minimal MSA-shaped local/deployable topology.'
    - 'Deterministic and evaluator-based release gates for accuracy, hallucination, latency, cost, safety, security, and ethics.'
  out_of_scope:
    - 'Generic document summarization as the product center.'
    - 'Multi-agent swarm, ambient credentials, arbitrary external API action, provider fallback, and unscoped delivery.'
    - 'Arbitrary shell commands, vector database infrastructure, and model-generated network destinations.'
    - 'Local LLM serving, always-on Docker Desktop, local PostgreSQL/Redis/Kafka, and production-grade sandbox isolation on the 8GB laptop.'
    - 'Project-specific logic imported directly into kernel modules or cross-pack table writes.'
    - 'Kubernetes, Kafka, service mesh, and per-service databases in the first deployment.'

