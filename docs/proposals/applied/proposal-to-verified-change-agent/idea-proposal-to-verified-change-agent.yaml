before:
  summary: |
    The current repository is an AI SaaS foundation. Its PRD explicitly keeps
    domain-specific agent workflows out of the foundation and exposes only
    run/tool/checkpoint contracts. The existing system map describes a
    LangGraph runtime and service boundaries, but it does not define one
    user-facing agent outcome that proves requirement coverage, evidence
    grounding, safe patching, and verification together.
  evidence:
    - 'PRD.md:29-34 — domain-specific agent workflows and automatic physical extraction are non-goals of the foundation.'
    - 'docs/sot/architecture/system-map.md:24-33 — the system map does not define domain-specific prompts or product features.'
    - 'docs/sot/architecture/system-map.md:58-68 — current logical boundaries separate the frontend, FastAPI agent API, LangGraph runtime, AI gateway, Postgres, and observability.'
    - 'docs/proposals/pending/ai-saas-foundation/msa-foundation.yaml — the foundation proposal prioritizes cost-tiered MSA contracts and worker extraction before domain-specific workflow breadth.'

after:
  summary: |
    A narrow change-assurance product turns an approved proposal and an
    authorized repository into a traceable change package: parsed requirements,
    targeted code evidence, an implementation plan, an approval record, a
    sandbox patch, test evidence, evaluator scores, and an auditable report.
    Every Git repository receives an inventory and evidence-backed plan. The
    system then auto-generates a capability profile and asks the user to
    confirm it before patching or delivery. Built-in Node/pnpm and Python/pytest
    adapters support verified execution; an unrecognized runtime degrades to a
    safe plan-only result. Verified output can flow through a signed Git/CI
    delivery adapter, so PR creation and policy-gated delivery are part of the
    product contract without granting the agent ambient deploy credentials.
    The same contracts expose two runtime profiles: Local Lite for an 8GB
    MacBook Air and Production MSA for isolated deployment. Local Lite uses at
    most two long-lived processes, SQLite checkpoints, a filesystem sandbox,
    remote model calls, and redacted LangSmith traces; it does not require
    Docker Desktop, PostgreSQL, Redis, Kafka, a vector database, or a local
    model.
    The reusable kernel owns contracts and controls; Proposal-to-Verified-Change
    is a replaceable Project Pack. A future project changes the pack, prompts,
    adapters, and datasets without rewriting auth, metering, workflow state,
    safety, metrics, or deployment profiles.
  files:
