    - path: packages/agent-platform-contracts/
      change: Define versioned product-neutral requirement, evidence, plan, patch, run, approval, evaluation, and verification schemas.
    - path: packages/agent-platform-kernel/
      change: Own policy, run state, checkpoint/resume, approval, metering, audit, sandbox boundary, evaluation ledger, and port interfaces without project-specific imports.
    - path: services/control-api/
      change: Own authenticated run creation, tenant scope, approvals, metering, lifecycle authority, and SSE access.
    - path: services/agent-orchestrator/
      change: Implement the typed LangGraph workflow, checkpoints, interrupts, bounded retries, and event mapping.
    - path: services/sandbox-worker/
