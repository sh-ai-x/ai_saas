title: Multi-Scenario Deployment Architecture with AWS Integration
status: ready-for-review
date: 2026-09-22
tags: [aws, multi-cloud, deployment, ecs, fargate, bedrock, vercel, fly-io, cost-minimal, portfolio, ai-engineer]

before:
  summary: |
    The current deployment story is single-platform: docker:local for dev,
    docker:stage for staging with Neon, and a planned Vercel production deploy
    that excludes the foundation API (which has no Vercel-native home for the
    long-running Python + SQLite + LangChain stack). There is no AWS footprint
    yet, no managed inference, no cross-region DR, and no concrete cost model
    per scenario. Model selection for the LLM adapter is ad-hoc; production
    picks are made by hand against unverified benchmarks. The agent's
    DeliveryPort only has a deterministic placeholder — no signed PR/CI
    adapter exists.
  evidence:
    - 'docs/proposals/applied/proposal-to-verified-change-agent/deployment-spec.md:1-50 — TL;DR names only docker:local, docker:stage, Vercel'
    - 'docs/proposals/applied/proposal-to-verified-change-agent/deployment-spec.md:60-90 — Vercel Functions cannot host the foundation as written'
    - 'services/delivery_gateway/gateway.py:42 — DeliveryPort.sign/validate is a contract only; no real Git/CI adapter'
    - 'services/agent_orchestrator/model_port.py:1-40 — only FakeStructuredModel + PromptContextAdapter exist; no remote adapter'
    - 'infra/aws/ — directory exists but is empty; no AWS provisioning documented'
    - 'No tests/exercises for production-tier LLM providers (Together, Bedrock)'

after:
  summary: |
    A **cost-minimal** deployment matrix scoped to what a single AI engineer
    can actually run and demo. The baseline is **Vercel (web) + Fly.io
    (foundation Docker) + Neon (Postgres) + Bedrock (managed LLM, pay-per-
    token)**, no GPU self-hosting, no multi-region. AWS appears only as
    the optional prod-promotion target once product-market fit justifies
    the spend. The agent gets a real LLM adapter (OpenAI Chat Completions
    API), a multi-model benchmark harness, and a signed Git/CI delivery
    adapter. AWS heavy services (ECS Fargate, Aurora Serverless v2, Cloud
    Front, multi-region, SageMaker) are listed explicitly as **deferred to a
    separate cost-justified proposal** — they ship only when traffic or
    compliance demands them, not on day one.
  files:
    - path: infra/aws/terraform/main.tf
      change: |
        Root module: VPC (multi-AZ), ECR repos for foundation + sandbox +
        web, ECS Fargate cluster, RDS Aurora Serverless v2 (Postgres),
        S3 bucket for artifacts, IAM roles for task execution + Bedrock +
        SageMaker.
    - path: infra/aws/terraform/ecs.tf
      change: |
        ECS Fargate services: foundation (1+ tasks), sandbox-worker
        (1+ tasks, larger CPU/RAM), inference (optional, see §3).
        ALB in front; WAF rules for /v1/*.
    - path: infra/aws/terraform/rds.tf
      change: |
        Aurora Serverless v2 cluster, single writer + 1 reader in stage,
        1 writer + 2 readers in prod. Encrypted at rest with KMS, backups
        retained 14 days (stage) / 35 days (prod). Drizzle uses the
        cluster endpoint (DATABASE_URL_UNPOOLED).
    - path: infra/aws/terraform/s3.tf
      change: |
        ai-saas-artifacts-<env> bucket, versioning on, lifecycle rules
        push review artifacts to Glacier after 90 days. SSE-KMS.
        Public access blocked; presigned URLs only.
    - path: infra/aws/terraform/route53_cf.tf
      change: |
        Route53 hosted zone, ACM certificate, CloudFront distribution
        with two origins (Vercel for the web, ALB for foundation).
        Failover routing policy on /api/foundation/*; latency on the rest.
    - path: infra/aws/terraform/bedrock.tf
      change: |
        Bedrock model access for Claude Sonnet, Haiku, Llama 3.1 70B.
        Cross-region inference profile for resilience. SageMaker is
        NOT in scope for the cost-minimal baseline; if a model not in
        Bedrock becomes required, that goes to a separate proposal.
    - path: services/agent_orchestrator/remote_model.py
      change: |
        OpenAICompatibleStructuredModel adapter (Ollama, vLLM, Bedrock
        via proxy, SageMaker via proxy, Together, Groq, Fireworks,
        OpenRouter). Strict JSON Schema response_format, retry with
        idempotency key.
    - path: services/delivery_gateway/github_adapter.py
      change: |
        Real DeliveryPort adapter: creates a signed branch + draft PR
        via PyGithub or REST, dispatches a policy-gated GitHub Actions
        workflow via repository_dispatch, scoped token per tenant.
    - path: scripts/run-benchmark.py
      change: |
        Multi-model benchmark harness: runs the proposal→plan→verify
        pipeline against N configured models, scores
        requirement_recall / evidence_precision / unsupported_claim_rate
        / p95 latency / tokens, writes results/<model>.json.
    - path: scripts/llm-serve.sh
      change: |
        Launcher for Ollama / vLLM / llama.cpp / Bedrock proxy based
        on env LLM_RUNNER; pulls from HuggingFace if needed.
    - path: infra/models/models.yaml
      change: |
        Model registry: tiny / default / quality / remote tiers with
        HF repo, runner, quantization, json_schema capability, RAM/VRAM.
    - path: benchmarks/cases/
      change: |
        Fixed regression set (10–20 cases) for the benchmark harness:
        toss-subscription-sandbox, faq-support-decision, proposal-decompose,
        evidence-grounding, prompt-injection-defense, large-repo-context.
    - path: docs/runbooks/aws-prod.md
      change: |
        Operator runbook: deploy order, rollback, on-call queries
        (RDS failover, ECS task restart, Bedrock throttling response).

pros:
  - 'Matches each workload to its native platform: Vercel CDN for the web, Fly.io for low-ops Docker, AWS for managed Postgres + heavy compute + global failover.'
  - 'Production LLM picks are evidence-backed: benchmark harness scores each candidate against a fixed regression set; default in models.yaml is the cheapest model that clears all gates.'
  - 'AWS footprint is IaC-only (Terraform); no manual console drift. Same code path for stage and prod via Terraform variables.'
  - 'Cost ceiling per scenario is enumerable from the Terraform plan output; cost surprises show up at review time, not at month-end.'
  - 'Sandbox worker moves to ECS Fargate with allowlisted task definitions; same contract as the Local Lite DeterministicSandbox but with real subprocess isolation.'
  - 'Multi-region failover for the foundation API (active/active via Route53 + ALB); RPO ≤ 5 min via Aurora cross-region replication for prod.'
  - 'DeliveryPort gains a real GitHub adapter with scoped tokens; signed PR + repository_dispatch workflow = auditable hand-off without ambient deploy credentials.'
  - 'Bedrock gives managed Claude / Llama without managing GPUs. SageMaker self-hosting is intentionally excluded from the cost-minimal baseline — pay-per-token Bedrock beats self-hosting until traffic justifies a dedicated endpoint, and that decision lives in a separate proposal when traffic arrives.'

cons:
  - 'Three platforms to operate (Vercel + Fly.io + AWS). On-call must know all three. Mitigated by Terraform owning AWS and runbooks for Fly/Vercel.'
  - 'Aurora Serverless v2 ACU minimum is 0.5; idle cost ~$40/month even when zero traffic. Mitigated by stopping stage outside business hours.'
  - 'Bedrock pay-per-token can spike if a runaway run burns the budget. Mitigated by the existing `TokenBudgetLedger` failing closed at plan-only 20k / verify 41k tokens; cost ceiling per run is hard-coded into the kernel, not a soft alert.'
  - 'Bedrock quotas vary by region; us-east-1 has the broadest catalog but is the slowest for KR users. Mitigated by cross-region inference profile + CloudFront latency routing.'
  - 'Terraform state in S3 + DynamoDB adds one more piece to bootstrap. Mitigated by infra/aws/terraform/bootstrap.sh one-shot script.'
  - 'ECS Fargate cold start (10–30s) shows up on the verify path. Mitigated by min_capacity=1 in prod, autoscale on CPU.'

limitations:
  - 'No Kubernetes, no ECS Fargate, no SageMaker, no Aurora, no multi-region in the baseline. The cost-minimal path is Vercel + Fly.io + Neon + Bedrock only. AWS service expansion (ECS, Aurora, multi-region) requires a separate cost-justified proposal.'
  - 'Bedrock does not (yet) expose Qwen models. If a Qwen-only workflow is needed, that goes to a separate proposal with its own cost ceiling (likely Ollama on a rented GPU box, not SageMaker).'
  - 'Multi-region active/active is for read-mostly endpoints. The LangGraph checkpoint store is single-region primary with async cross-region copy; failover loses the in-flight checkpoint but does not lose history.'
  - 'No SOC2 / HIPAA / PCI controls in scope. The proposal ships the IaC for VPC + KMS + IAM boundaries, but the compliance audit itself is a separate track.'
  - 'Sandbox worker on Fargate inherits the same allowlist semantics as the Local Lite DeterministicSandbox; production-grade untrusted-code isolation (gVisor / Firecracker microVM) is a separate proposal.'

sections:
  - title: Scenario matrix
    body: |
      Four scenarios, each with an explicit platform choice and budget.

      | Scenario | Web | Foundation | DB | LLM | Sandbox | $/mo (low) | $/mo (typical) |
      |---|---|---|---|---|---|---:|---:|
      | 1. Solo / laptop | localhost:3100 | localhost:8180 | local Postgres | Ollama (CPU/GPU) | DeterministicSandbox | $0 | $0 |
      | 2. Side project (Vercel + Fly) | Vercel | Fly.io (Docker) | Neon free | Groq / Together free tier | Fly.io sandbox worker (1× shared-cpu-1x) | $0 | $7 |
      | 3. Production lite (Vercel + Fly + AWS managed) | Vercel Pro | Fly.io (Docker, scale-to-2) | Neon launch | Bedrock (Claude Haiku) | Fly.io sandbox worker | $50 | $200 |
      | 4. Production full (AWS multi-region, deferred) | CloudFront→Vercel | ECS Fargate (2×) | Aurora Serverless v2 | Bedrock only | ECS Fargate sandbox | $400 | $1,200 |

      The agent's contract does not change across scenarios. Only env vars
      (`LLM_BASE_URL`, `DATABASE_URL`, `FOUNDATION_API_URL`) change.

  - title: AWS service map
    body: |
      | AWS service | Role | When used |
      |---|---|---|
      | VPC (multi-AZ) | Network isolation | All AWS scenarios |
      | ECR | Container images for foundation + sandbox + (optional) inference | All |
      | ECS Fargate | foundation-api, sandbox-worker task services | Scenarios 3–4 |
      | ALB | L7 routing for foundation-api | Scenarios 3–4 |
      | WAF | Rate limiting + IP allowlist on /v1/* | Scenarios 3–4 |
      | RDS Aurora Serverless v2 | Managed Postgres, single writer + N readers | Scenarios 3–4 (or stay on Neon) |
      | S3 | Review artifact storage, Terraform state | All |
      | KMS | Encryption at rest (RDS, S3, EBS) | All |
      | IAM | Task execution role + Bedrock/SageMaker invoke policies | All |
      | Secrets Manager | APP_SECRET_KEY, TOSS_SECRET_KEY, etc. | All |
      | CloudWatch + X-Ray | Logs, metrics, traces | All |
      | Route 53 + ACM | DNS + TLS | Scenario 4 |
      | CloudFront | Edge CDN with two origins | Scenario 4 |
      | Bedrock | Managed Claude / Llama / Mistral | Scenarios 3–4 |
      | SageMaker | **Out of baseline.** Add only via a separate proposal that justifies the GPU $/hr vs Bedrock $/token. | None |
      | Terraform state: S3 + DynamoDB lock | IaC state | All |

  - title: LLM provider strategy
    body: |
      The OpenAI-compatible adapter (`OpenAICompatibleStructuredModel`) covers
      every provider below without code changes — only `LLM_BASE_URL` and
      `LLM_MODEL` env vars differ.

      | Tier | Provider | Model | When |
      |---|---|---|---|
      | Tiny (laptop) | Ollama | phi-3.5-mini-3.8b / qwen-3b | dev, smoke tests |
      | Default (Vercel/Fly) | Groq / Together | llama-3.1-8b / qwen-72b free | low-cost staging |
      | Quality (prod lite) | AWS Bedrock | claude-haiku-4-5 / llama-3.1-70b | scenario 3 |
      | Frontier (prod full) | AWS Bedrock | claude-sonnet-4-5 | scenario 4, hot path |
      | Self-hosted | Deferred to a separate proposal | n/a | Only if Bedrock lacks the required model |

      All four tiers are exercised by the benchmark harness
      (`scripts/run-benchmark.py`) against the fixed regression set under
      `benchmarks/cases/`. The default in `infra/models/models.yaml` is the
      cheapest tier that meets all gates (recall ≥ 0.95, evidence precision ≥
      0.98, unsupported claim rate ≤ 0.02, p95 latency ≤ 120s plan / 600s
      verify, zero-tolerance checks = 0).

  - title: Multi-region and DR
    body: |
      Scenario 4 adds multi-region to the foundation API:

      - **Primary region** (`ap-northeast-2`, Seoul): ECS service (2 tasks),
        Aurora writer, S3 bucket.
      - **Secondary region** (`ap-northeast-1`, Tokyo): ECS service (1 task,
        warm standby), Aurora cross-region replica (async, lag ≤ 5s under
        normal load), S3 cross-region replication.
      - **Route 53 failover** record on `api.<domain>`: ALB health check
        triggers DNS failover ≤ 60s.
      - **RPO / RTO**: RPO ≤ 5 min (Aurora replication lag), RTO ≤ 2 min
        (Route 53 failover + ECS warm task in Tokyo).

      The LangGraph checkpoint store is single-region primary; cross-region
      copy is async. Failover loses the in-flight checkpoint (the run is
      marked `failed` and can be resumed from the last persisted state).

      For scenarios 1–3, single-region is the default. Multi-region is a
      deliberate spend; do not enable until product-market fit.

  - title: Security and IAM boundaries
    body: |
      The agent's existing rules R7 / R12 carry over without modification.

      - **IAM task execution role** has `bedrock:InvokeModel`,
        `secretsmanager:GetSecretValue` on the
        prefix `ai-saas/<env>/*`, `s3:PutObject` on the artifact bucket,
        `logs:CreateLogStream` on the foundation log group. Nothing else.
        `sagemaker:*` is not granted in the cost-minimal baseline.
      - **Bedrock invocation logs** are written to a dedicated
        CloudWatch log group with 30-day retention. Tenant ID is redacted
        before write (the kernel `redaction.py` already does this).
      - **Secrets** live in Secrets Manager under `ai-saas/<env>/<key>`;
        ECS tasks pull them at startup; never embedded in the image.
      - **WAF rules** on the ALB: rate-limit 100 req/min on `/v1/runs`,
        block known bad ASNs, AWS managed ruleset `AWSManagedRulesCommonRuleSet`.
      - **VPC**: foundation + sandbox tasks run in private subnets; ALB in
        public subnets; NAT gateway for outbound only when Bedrock requires it.
      - **Tenant isolation** is enforced at the application layer
        (existing `auth.py` checks `x-tenant-id`). No shared DB row crosses
        tenants.

  - title: Cost model (Terraform plan output drives review)
    body: |
      The CI step `terraform plan -out=tfplan` produces a dollar figure for
      every resource. The PR comment includes the diff vs the previous
      plan output. The cost review is part of the maintenance gate.

      | Resource | Scenario 3 ($/mo) | Scenario 4 ($/mo, deferred) |
      |---|---:|---:|
      | Fly.io foundation (1× shared-cpu-1x, always-on) | $5 | n/a |
      | Fly.io sandbox worker (1× shared-cpu-1x) | $5 | n/a |
      | Neon Postgres (Launch / Scale plan) | $0–19 | $0–19 |
      | Vercel (Hobby / Pro) | $0 | $20 |
      | Bedrock (1M input + 0.5M output tokens / mo) | $5–15 | $30–80 |
      | S3 (artifacts, 10 GB, Glacier after 90 d) | $1 | $3 |
      | CloudWatch logs + metrics | $2 | $5 |
      | Secrets Manager (5 secrets) | $1 | $2 |
      | ECS Fargate foundation (2 tasks) | n/a | $70 |
      | ECS Fargate sandbox (1 task) | n/a | $50 |
      | Aurora Serverless v2 (avg 1.5 ACU) | n/a | $180 |
      | ALB + WAF | n/a | $30 |
      | Route 53 + ACM | n/a | $5 |
      | CloudFront (1 TB egress) | n/a | $85 |
      | **Total (cost-minimal baseline)** | **~$5–25** | **~$540–580** |

      **Portfolio target**: scenario 3 runs end-to-end on $5–25/mo for a
      single AI engineer. Scenario 4 (multi-region AWS) is documented but
      not built until traffic or compliance justifies the spend.

      The benchmark harness records `tokens_per_run`. Cost ceiling per
      plan_only run: $0.20 (Haiku) / $0.05 (Groq 70B). Cost ceiling per
      verify run: $0.40 (Haiku) / $0.10 (Groq 70B). Quarterly review
      re-runs the benchmark and adjusts.

  - title: Migration path (phased)
    body: |
      The proposal ships as four phases, each independently shippable.

      **Phase 1 (already done)** — Local Lite + offline slice.
      PR #33. `agent_platform/`, `project_packs/`, `services/`,
      `infra/profiles/local-lite/`.

      **Phase 2 (in progress)** — Vercel + Fly.io + multi-model.
      Branch `docs/proposal-deployment-spec`. `LLM_PROVIDER` env wiring,
      OpenAI-compatible adapter, `docker:stage`, benchmark harness.

      **Phase 3 (next, ~2 weeks)** — AWS managed services.
      Add `infra/aws/terraform/` (VPC, RDS, S3, ECS, ALB, IAM, Secrets
      Manager). Wire Fly.io foundation to point at RDS / S3 / Bedrock.
      Enable Bedrock in stage; A/B test against Groq for cost.

      **Phase 4 (later, only when traffic justifies)** — Multi-region AWS.
      Route 53 failover, Aurora cross-region replica, Tokyo warm standby.
      **No SageMaker in any phase.** If a model Bedrock lacks becomes
      required, the cost-minimal path is Ollama on a rented GPU box (~$0.30/hr
      spot), not SageMaker. Full scenario 4 cost model validated against
      actual production traffic before committing.

      Each phase is gated by the same release gates (recall, precision,
      latency, tokens, zero-tolerance checks). No phase is "done" without
      a green benchmark run + green prod-traffic canary.

  - title: What stays the same
    body: |
      Rules R1–R14 ([rules/proposal-to-verified-change-agent.md](../../../rules/proposal-to-verified-change-agent.md))
      and the existing ports in `agent_platform/ports.py` are not modified.
      The `StructuredModelPort` Protocol already covers Ollama / vLLM /
      Bedrock / SageMaker / Together / Groq / OpenAI via the same JSON
      Schema request shape. The `SandboxPort` contract is unchanged;
      Fargate replaces the Local Lite subprocess only at the boundary.
      The `DeliveryPort` gains a GitHub adapter but keeps the same
      `sign(**kwargs) / validate(request)` shape. No upstream consumer of
      the kernel is affected.

  - title: Open questions for review
    body: |
      1. **Aurora vs Neon for prod?** Aurora gives full AWS integration but
         ~$60/mo idle floor. Neon Launch stays free until 0.5 GB. Decide
         based on whether RDS failover and cross-region replica are
         must-haves. **Default stays on Neon** for the cost-minimal baseline.
      2. **No SageMaker in any phase.** If a model Bedrock lacks becomes
         required, the cost-minimal path is Ollama on a rented GPU box
         (~$0.30/hr spot, RunPod / Vast.ai / Lambda Labs), shut down when
         idle. That decision lives in a separate proposal.
      3. **Cost anomaly alerts** — CloudWatch anomaly detection on
         Bedrock `InputTokenCount` per tenant; alert at 2× weekly average.
         Open: what is the right Slack channel?
      4. **On-call rotation** — even on the cost-minimal path, two
         platforms (Vercel + Fly.io) means the on-call needs runbooks for
         both. See `docs/runbooks/` which this proposal creates.

  - title: Hand-off
    body: |
      Approved path: Phase 2 PRs merge first; Phase 3 IaC reviewed in a
      separate design review (cost + security); Phase 4 waits on prod
      traffic validation.

      `/dev-kit:plan` consumes this proposal as the design record for
      the AWS integration phase. `/dev-kit:build` implements only the
      files listed in `after.files` above; Terraform applies to a
      disposable stage AWS account first.