[project]
name = "live-docs"
version = "0.1.0"
description = "Live Docs runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-openai>=0.2,<1.0",
    "langgraph>=0.2,<1.0",
    "langsmith>=0.2,<1.0",
    "pypdf>=5,<7",
    "ragas>=0.4.3,<0.5",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
