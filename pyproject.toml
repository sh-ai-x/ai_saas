[project]
name = "ai-saas-foundation"
version = "0.1.0"
description = "Contract-first AI SaaS foundation runtime"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
langchain = [
  "langchain-core>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langsmith>=0.4,<1.0",
  "langchain-openai>=1.0,<2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
